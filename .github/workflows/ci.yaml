name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go test -race ./...
      - name: gofumpt (formatting)
        run: |
          go install mvdan.cc/gofumpt@latest
          diff="$(gofumpt -l .)"
          if [ -n "$diff" ]; then echo "not gofumpt-clean:"; echo "$diff"; exit 1; fi

  integration:
    # Real NUT daemons: prove a shed signal shuts a upsmon secondary, and that the
    # real controller sheds/recovers MULTIPLE servers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: install NUT
        run: sudo apt-get update && sudo apt-get install -y nut-server nut-client
      - name: shed-signal test (single secondary)
        run: sudo --preserve-env=PATH ./test/integration/shed_test.sh
      - name: controller end-to-end (multi-server)
        run: sudo --preserve-env=PATH,HOME ./test/integration/controller_e2e.sh

  image:
    # Build + smoke-test the image on every push/PR (no push here).
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nut-dog:smoke
      - name: image smoke test
        run: ./test/integration/image_smoke.sh nut-dog:smoke

  release:
    # semantic-release: derive the version from conventional commits, build+push
    # the multi-arch image for it, and cut a GitHub release. main only.
    needs: [test, integration, image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
